spring.application.name=ms-vendas
server.port=8083

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:vendas
spring.datasource.username=sa
spring.datasource.password=

# H2 Driver
spring.datasource.driver-class-name=org.h2.Driver

# JPA and Hibernate specific configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# As consultas carregam os itens com @EntityGraph; a sessão JPA não fica aberta durante a requisição
spring.jpa.open-in-view=false

# H2 Console (opcional, para acessar o console web)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Respostas de erro sem stack trace
server.error.include-stacktrace=never

# Microsserviços consumidos pelo orquestrador
servicos.clientes.url=http://localhost:8084
servicos.produtos.url=http://localhost:8082
servicos.estoque.url=http://localhost:8081
# Tempo máximo para abrir a conexão e para esperar a resposta de cada chamada
servicos.timeout.conexao=2s
servicos.timeout.leitura=5s
